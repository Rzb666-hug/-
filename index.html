<!doctype html>
<html lang="zh-CN">
<head>

<meta name="theme-color" content="#0F1716" media="(prefers-color-scheme: dark)">

<title>四六级核心550词</title>
<style>
  /* Design plan — palette: cool exam-paper neutrals, deep teal accent, amber for "不熟"
     type: Instrument Serif for headwords, Inter + PingFang for IPA/UI/meanings
     layout: single-screen flashcard column, 50-dot answer-sheet meter per block */
  :root {
    color-scheme: light;
    --bg: #E9EDEC;
    --surface: #FBFCFB;
    --ink: #15211F;
    --muted: #5C6B68;
    --line: #CBD5D2;
    --accent: #1D6B5F;
    --known-bg: #1D6B5F;
    --known-ink: #FFFFFF;
    --unknown-bg: #FAEEDA;
    --unknown-ink: #7E4F08;
    --unknown-line: #E2BE7E;
    --warn: #A8650A;
    --current-bg: #E2EDE9;
    --backdrop: rgba(10, 20, 18, 0.45);
    --shadow: 0 1px 2px rgba(15, 30, 28, 0.06), 0 14px 36px -18px rgba(15, 30, 28, 0.4);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0F1716;
      --surface: #17211F;
      --ink: #E7EFEC;
      --muted: #94A5A1;
      --line: #2A3734;
      --accent: #79C7B5;
      --known-bg: #79C7B5;
      --known-ink: #0A1513;
      --unknown-bg: #2A2216;
      --unknown-ink: #F0C37E;
      --unknown-line: #584529;
      --warn: #EBB264;
      --current-bg: #1C2B27;
      --backdrop: rgba(0, 0, 0, 0.6);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 18px 40px -20px rgba(0, 0, 0, 0.8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F1716;
    --surface: #17211F;
    --ink: #E7EFEC;
    --muted: #94A5A1;
    --line: #2A3734;
    --accent: #79C7B5;
    --known-bg: #79C7B5;
    --known-ink: #0A1513;
    --unknown-bg: #2A2216;
    --unknown-ink: #F0C37E;
    --unknown-line: #584529;
    --warn: #EBB264;
    --current-bg: #1C2B27;
    --backdrop: rgba(0, 0, 0, 0.6);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 18px 40px -20px rgba(0, 0, 0, 0.8);
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button { font-family: inherit; }
  button:focus-visible, .flip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    height: 100%;
    max-width: 560px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-block: 10px 14px;
    min-height: 0;
  }

  /* header */
  .bar { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .bar-actions { display: flex; gap: 8px; flex: 0 0 auto; }
  .eyebrow {
    margin: 0 0 2px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: 0.01em; line-height: 1.15; }
  .ghost {
    height: 36px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .progress-row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    font-size: 12px; color: var(--muted); letter-spacing: 0.02em;
  }
  #countLabel { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); font-size: 13px; }
  .dots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .dot { height: 6px; border-radius: 2px; background: var(--line); transition: background 0.2s ease, transform 0.2s ease; }
  .dot.done.known { background: var(--accent); }
  .dot.done.unfamiliar { background: var(--warn); }
  .dot.current { background: var(--ink); transform: scaleY(1.7); }
  .speak-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .accent-note { font-size: 11px; letter-spacing: 0.05em; color: var(--muted); }
  .toggle {
    display: inline-flex; align-items: center; gap: 7px;
    border: 0; background: transparent; padding: 2px 0;
    color: var(--muted); font-size: 11.5px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .toggle .track {
    width: 30px; height: 18px; border-radius: 999px;
    background: var(--line); position: relative; transition: background 0.2s ease;
  }
  .toggle .thumb {
    position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--surface); transition: transform 0.2s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .toggle.on { color: var(--accent); }
  .toggle.on .track { background: var(--accent); }
  .toggle.on .thumb { transform: translateX(12px); }
  .no-tts .speak-btn, .no-tts .speak-row { display: none !important; }

  /* card */
  .stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .flip {
    flex: 1 1 auto;
    min-height: 250px;
    perspective: 1600px;
    cursor: pointer;
    border-radius: 22px;
    -webkit-tap-highlight-color: transparent;
  }
  .flip-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.25, 1);
  }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 62px 22px 46px;
    gap: 10px;
    text-align: center;
    overflow: hidden;
  }
  .face.back { transform: rotateY(180deg); }
  .no {
    position: absolute; top: 16px; left: 20px; margin: 0;
    font-size: 11px; letter-spacing: 0.08em; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .speak-btn {
    position: absolute; top: 9px; right: 9px;
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--line);
    color: var(--muted); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .speak-btn:hover { color: var(--accent); border-color: var(--accent); }
  .speak-btn.playing { color: var(--known-bg); border-color: var(--known-bg); background: var(--current-bg); }
  .word {
    margin: 0;
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(42px, 12vw, 74px);
    line-height: 1.02;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
    text-wrap: balance;
  }
  .word.mid { font-size: clamp(30px, 8.4vw, 50px); }
  .word.long { font-size: clamp(24px, 6.6vw, 38px); }
  .ipa {
    margin: 0;
    font-size: clamp(14px, 4.2vw, 18px);
    letter-spacing: 0.01em;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .back-head {
    position: absolute; top: 14px; left: 20px; right: 58px;
    display: flex; flex-direction: column; gap: 2px; text-align: left;
  }
  .back-word {
    margin: 0; font-family: "Instrument Serif", Georgia, serif;
    font-size: 16px; letter-spacing: 0.02em;
  }
  .back-ipa { margin: 0; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
  .meaning {
    margin: 0;
    font-size: clamp(20px, 5.6vw, 28px);
    line-height: 1.55;
    font-weight: 500;
    max-width: 26ch;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  .hint {
    position: absolute; bottom: 15px; left: 0; right: 0; margin: 0;
    font-size: 11.5px; letter-spacing: 0.08em; color: var(--muted);
  }

  /* controls */
  .controls { flex: 0 0 auto; display: flex; flex-direction: column; gap: 9px; }
  .nav-row { display: flex; gap: 10px; }
  .mini {
    flex: 1; height: 38px; border-radius: 11px;
    border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .mini:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
  .mini:disabled { opacity: 0.4; cursor: default; }
  .mark-row { display: flex; gap: 10px; }
  .mark {
    flex: 1; height: 52px; border-radius: 15px;
    border: 1px solid transparent; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: transform 0.08s ease, filter 0.15s ease;
  }
  .mark:active { transform: scale(0.98); }
  .mark.unknown { background: var(--unknown-bg); color: var(--unknown-ink); border-color: var(--unknown-line); }
  .mark.known { background: var(--known-bg); color: var(--known-ink); }
  .kbd-hint { margin: 0; text-align: center; font-size: 11px; letter-spacing: 0.05em; color: var(--muted); }
  @media (hover: none) { .kbd-hint { display: none; } }

  /* end screen */
  .end {
    flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center;
    gap: 14px; padding: 6px 2px; text-align: center;
  }
  .end h2 { margin: 0; font-size: 25px; font-weight: 600; line-height: 1.25; }
  .end .sub { margin: -6px 0 2px; font-size: 13.5px; line-height: 1.6; color: var(--muted); }
  .stats { display: flex; gap: 12px; }
  .stat {
    flex: 1; border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface); padding: 14px 10px 12px;
  }
  .stat .n { display: block; font-size: 34px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .n.warn { color: var(--warn); }
  .stat .l { display: block; margin-top: 3px; font-size: 11.5px; letter-spacing: 0.1em; color: var(--muted); }
  .end-actions { display: flex; flex-direction: column; gap: 9px; }
  .cta {
    height: 50px; border: 1.5px solid transparent; border-radius: 15px;
    background: var(--known-bg); color: var(--known-ink);
    font-size: 15.5px; font-weight: 600; cursor: pointer;
  }
  .cta.secondary { background: transparent; color: var(--accent); border-color: var(--accent); }
  .cta:disabled { opacity: 0.45; cursor: default; }
  .cta:active:not(:disabled) { transform: scale(0.99); }

  /* sheets */
  .sheet {
    position: fixed; inset: 0; z-index: 50; background: var(--backdrop);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet-panel {
    width: 100%; max-width: 560px; max-height: 84vh;
    background: var(--surface); color: var(--ink);
    border-radius: 20px 20px 0 0; border-top: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet-head {
    flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
    gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line);
  }
  .sheet-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .sheet-sub { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
  .block-list { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .block-row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 13px 18px; background: transparent; border: 0;
    border-bottom: 1px solid var(--line); color: var(--ink);
    text-align: left; cursor: pointer; font-size: 14px;
  }
  .block-row:last-child { border-bottom: none; }
  .block-row.current { background: var(--current-bg); }
  .block-name { font-weight: 600; white-space: nowrap; }
  .block-range { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .block-meta { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chev { color: var(--muted); font-size: 18px; line-height: 1; }

  .word-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .word-list li {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto auto;
    gap: 1px 10px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
  }
  .word-list li:last-child { border-bottom: none; }
  .word-list .w { grid-area: 1 / 1; font-family: "Instrument Serif", Georgia, serif; font-size: 19px; line-height: 1.25; overflow-wrap: anywhere; }
  .word-list .ipa { grid-area: 2 / 1; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .word-list .m { grid-area: 3 / 1 / 4 / 3; font-size: 13px; line-height: 1.5; color: var(--muted); margin-top: 2px; }
  .mini-speak {
    grid-area: 1 / 2 / 3 / 3;
    align-self: start;
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--line);
    color: var(--muted); cursor: pointer; padding: 0;
  }
  .mini-speak:hover { color: var(--accent); border-color: var(--accent); }
  .mini-speak.playing { color: var(--known-bg); border-color: var(--known-bg); }

  @media (prefers-reduced-motion: reduce) {
    .flip-inner, .dot, .mark, .toggle .track, .toggle .thumb { transition: none; }
    .mark:active { transform: none; }
  }

  /* --- mobile shell --- */
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body { -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
  .app { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  @media (hover: none) { .ghost:hover { border-color: var(--line); color: var(--ink); } }

<div class="app">
  <header class="bar">
    <div class="bar-row">
      <div>
        <p class="eyebrow">CET 4/6 · 550 词</p>
        <h1>四六级核心550词</h1>
      </div>
      <div class="bar-actions">
        <button class="ghost" id="blocksBtn" type="button">分组</button>
        <button class="ghost" id="listBtn" type="button">词表</button>
      </div>
    </div>
    <div class="progress-row">
      <span id="roundLabel">第 1 组 · 1–50</span>
      <span id="countLabel">1 / 50</span>
    </div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="speak-row">
      <span class="accent-note">英式音标 · 英式读音</span>
      <button class="toggle on" id="autoBtn" type="button" aria-pressed="true">
        <span class="track"><span class="thumb"></span></span>
        <span>自动朗读</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <div class="flip" id="flip" role="button" tabindex="0" aria-label="单词卡片，点击翻面看释义">
      <div class="flip-inner">
        <section class="face front">
          <p class="no" id="noLabel">No. 1</p>
          <button class="speak-btn" id="speakFront" type="button" aria-label="朗读单词">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.5 9.5h3L12 6.2v11.6L7.5 14.5h-3z"/>
              <path d="M15.5 9.2a4 4 0 0 1 0 5.6"/>
              <path d="M18 6.8a7.6 7.6 0 0 1 0 10.4"/>
            </svg>
          </button>
          <p class="word" id="word">alter</p>
          <p class="ipa" id="ipa">/ˈɔːltə(r)/</p>
          <p class="hint">点击翻面</p>
        </section>
        <section class="face back">
          <div class="back-head">
            <p class="back-word" id="backWord">alter</p>
            <p class="back-ipa" id="backIpa">/ˈɔːltə(r)/</p>
          </div>
          <button class="speak-btn" id="speakBack" type="button" aria-label="朗读单词">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.5 9.5h3L12 6.2v11.6L7.5 14.5h-3z"/>
              <path d="M15.5 9.2a4 4 0 0 1 0 5.6"/>
              <path d="M18 6.8a7.6 7.6 0 0 1 0 10.4"/>
            </svg>
          </button>
          <p class="meaning" id="meaning">v. 改变，改动，变更</p>
          <p class="hint">点击返回</p>
        </section>
      </div>
    </div>

    <section class="end" id="end" hidden>
      <div>
        <p class="eyebrow" id="endRound">第 1 组 · 1–50</p>
        <h2 id="endTitle">本组完成</h2>
      </div>
      <p class="sub" id="endSub"></p>
      <div class="stats">
        <div class="stat"><span class="n" id="statKnown">0</span><span class="l">认 识</span></div>
        <div class="stat"><span class="n warn" id="statUnknown">0</span><span class="l">不 熟</span></div>
      </div>
      <div class="end-actions">
        <button class="cta" id="nextBlockBtn" type="button">进入下一组（51–100）</button>
        <button class="cta secondary" id="retryBtn" type="button">重练不熟的词</button>
        <button class="ghost" id="againBtn" type="button">重新过本组</button>

    </section>
  </main>

  <footer class="controls" id="controls">
    <div class="nav-row">
      <button class="mini" id="prevBtn" type="button">← 上一词</button>
      <button class="mini" id="nextBtn" type="button">下一词 →</button>

    <div class="mark-row">
      <button class="mark unknown" id="unknownBtn" type="button">✗ 不熟</button>
      <button class="mark known" id="knownBtn" type="button">✓ 认识</button>

  </footer>
</div>

<div class="sheet" id="blocksSheet" hidden>

    <div class="sheet-head">
      <div>
        <h2>选择分组</h2>
        <p class="sheet-sub">共 11 组 · 每组 50 词</p>
      </div>
      <button class="ghost" id="closeBlocks" type="button">关闭</button>
    </div>
    <div class="block-list" id="blockList"></div>
  </div>
</div>

<div class="sheet" id="listSheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="本组词表">
    <div class="sheet-head">
      <div>
        <h2 id="listTitle">第 1 组 · 1–50</h2>
        <p class="sheet-sub">点击右侧喇叭朗读</p>
      </div>
      <button class="ghost" id="closeList" type="button">关闭</button>
    </div>
    <ol class="word-list" id="listItems"></ol>
  </div>
</div>

<script>
  const WORDS = [
    { n: 1, w: "alter", ipa: "/ˈɔːltə(r)/", m: "v. 改变，改动，变更" },
    { n: 2, w: "burst", ipa: "/bɜːst/", m: "vi. n. 突然发生，爆裂" },

    { n: 9, w: "bacteria", ipa: "/bækˈtɪəriə/", m: "n. 细菌" },
    { n: 10, w: "budget", ipa: "/ˈbʌdʒɪt/", m: "n. 预算" },

    { n: 544, w: "predictable", ipa: "/prɪˈdɪktəbl/", m: "a. 可预判的" },
    { n: 545, w: "preference", ipa: "/ˈprefrəns/", m: "n. 偏好偏爱" },
    { n: 546, w: "progressive", ipa: "/prəˈɡresɪv/", m: "a. 循序渐进的" },
    { n: 547, w: "economic", ipa: "/ˌiːkəˈnɒmɪk/", m: "a. 经济的" },
    { n: 548, w: "proportion", ipa: "/prəˈpɔːʃn/", m: "n. 占比份额" },
    { n: 549, w: "publish", ipa: "/ˈpʌblɪʃ/", m: "vt. 刊发，发表" },
    { n: 550, w: "possess", ipa: "/pəˈzes/", m: "vt. 拥有" }
  ];

  const PER_BLOCK = 50;
  const BLOCK_COUNT = Math.ceil(WORDS.length / PER_BLOCK);
  const byN = new Map(WORDS.map(w => [w.n, w]));
  const BLOCK_NS = Array.from({ length: BLOCK_COUNT }, () => []);
  WORDS.forEach(w => {
    BLOCK_NS[Math.floor((w.n - 1) / PER_BLOCK)].push(w.n);
  });

  const KEY = "cet550.v1";
  const hasTTS = "speechSynthesis" in window;

  function freshBlock(b) {
    return { queue: BLOCK_NS[b].slice(), idx: 0, status: {}, finished: false, round: 1 };
  }

  const state = {
    block: 0,
    autoSpeak: true,
    blocks: Array.from({ length: BLOCK_COUNT }, (_, b) => freshBlock(b))
  };

  const el = id => document.getElementById(id);
  const SPK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9.5h3L12 6.2v11.6L7.5 14.5h-3z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18 6.8a7.6 7.6 0 0 1 0 10.4"/></svg>';

  function rangeText(b) {
    const ns = BLOCK_NS[b];
    return ns[0] + "–" + ns[ns.length - 1];
  }
  function blockLabel(b) {
    return "第 " + (b + 1) + " 组 · " + rangeText(b);
  }

  /* ---------- storage ---------- */
  function loadState() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (!saved) return;
      if (Number.isInteger(saved.block) && saved.block >= 0 && saved.block < BLOCK_COUNT) {
        state.block = saved.block;
      }
      if (typeof saved.autoSpeak === "boolean") state.autoSpeak = saved.autoSpeak;
      if (Array.isArray(saved.blocks)) {
        for (let b = 0; b < BLOCK_COUNT; b++) {
          const sb = saved.blocks[b];
          if (!sb || !Array.isArray(sb.queue)) continue;
          const allowed = new Set(BLOCK_NS[b]);
          const queue = sb.queue.map(Number).filter(n => allowed.has(n));
          if (!queue.length) continue;
          const status = {};
          if (sb.status && typeof sb.status === "object") {
            for (const [k, v] of Object.entries(sb.status)) {
              const n = Number(k);
              if (allowed.has(n) && (v === "known" || v === "unfamiliar")) status[n] = v;
            }
          }
          const idx = Math.min(Math.max(0, Number(sb.idx) || 0), queue.length);
          state.blocks[b] = {
            queue,
            idx,
            status,
            finished: !!sb.finished,
            round: Number.isInteger(sb.round) && sb.round > 0 ? sb.round : 1
          };
          if (state.blocks[b].finished) state.blocks[b].idx = queue.length;
        }
      }
    } catch (e) {
      /* storage unavailable — run in memory */
    }
  }

  function saveState() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      /* ignore */
    }
  }

  /* ---------- speech ---------- */
  let voice = null;
  let lastSpokenN = null;
  let didStart = false;

  function pickVoice() {
    if (!hasTTS) return;
    let voices = [];
    try { voices = window.speechSynthesis.getVoices(); } catch (e) { return; }
    if (!voices.length) return;
    voice =
      voices.find(v => /^en[-_]GB/i.test(v.lang) && /libby|hazel|female|uk/i.test(v.name)) ||
      voices.find(v => /^en[-_]GB/i.test(v.lang)) ||
      voices.find(v => /^en[-_]US/i.test(v.lang)) ||
      null;
  }

  function cancelSpeech() {
    if (!hasTTS) return;
    try { window.speechSynthesis.cancel(); } catch (e) {}
    document.querySelectorAll(".playing").forEach(b => b.classList.remove("playing"));
  }

  function speak(text, btn) {
    if (!hasTTS) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-GB";
      u.rate = 0.85;
      if (voice) u.voice = voice;
      u.onstart = () => {
        didStart = true;
        if (btn) btn.classList.add("playing");
      };
      u.onend = () => { if (btn) btn.classList.remove("playing"); };
      u.onerror = () => { if (btn) btn.classList.remove("playing"); };
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function currentWordObj() {
    const bs = state.blocks[state.block];
    if (bs.finished) return null;
    return byN.get(bs.queue[bs.idx]) || null;
  }

  function speakCurrent(btn) {
    const w = currentWordObj();
    if (w) speak(w.w, btn || null);
  }

  /* ---------- render ---------- */
  function render() {
    const bs = state.blocks[state.block];
    const label = blockLabel(state.block);
    el("roundLabel").textContent = label + (bs.round > 1 ? " · 第 " + bs.round + " 轮" : "");

    const shown = bs.finished ? bs.queue.length : Math.min(bs.idx + 1, bs.queue.length);
    el("countLabel").textContent = shown + " / " + bs.queue.length;

    const dots = el("dots");
    dots.innerHTML = "";
    const frag = document.createDocumentFragment();
    bs.queue.forEach((n, i) => {
      const dot = document.createElement("span");
      dot.className = "dot";
      const st = bs.status[n];
      if (st) dot.classList.add("done", st);
      if (i === bs.idx && !bs.finished) dot.classList.add("current");
      frag.appendChild(dot);
    });
    dots.appendChild(frag);

    el("autoBtn").classList.toggle("on", state.autoSpeak);
    el("autoBtn").setAttribute("aria-pressed", String(state.autoSpeak));

    if (bs.finished) {
      cancelSpeech();
      renderEnd(bs);
      return;
    }

    el("flip").hidden = false;
    el("end").hidden = true;
    el("controls").hidden = false;

    const w = byN.get(bs.queue[bs.idx]);
    if (!w) return;
    el("noLabel").textContent = "No. " + w.n;
    const wordEl = el("word");
    wordEl.textContent = w.w;
    wordEl.className = "word" + (w.w.length > 14 ? " long" : w.w.length > 12 ? " mid" : "");
    el("ipa").textContent = w.ipa;
    el("backWord").textContent = w.w;
    el("backIpa").textContent = w.ipa;
    el("meaning").textContent = w.m;
    el("speakFront").setAttribute("aria-label", "朗读 " + w.w);
    el("speakBack").setAttribute("aria-label", "朗读 " + w.w);
    el("flip").classList.remove("flipped");
    el("prevBtn").disabled = bs.idx === 0;
    el("nextBtn").disabled = bs.idx >= bs.queue.length - 1;

    if (state.autoSpeak && w.n !== lastSpokenN) {
      lastSpokenN = w.n;
      speak(w.w);
    }
  }

  function renderEnd(bs) {
    el("flip").hidden = true;
    el("controls").hidden = true;
    el("end").hidden = false;

    const known = bs.queue.filter(n => bs.status[n] === "known").length;
    const unknown = bs.queue.filter(n => bs.status[n] === "unfamiliar").length;
    const allDone = state.blocks.every(b => b.finished);

    el("endRound").textContent = blockLabel(state.block) + (bs.round > 1 ? " · 第 " + bs.round + " 轮" : "");
    el("statKnown").textContent = known;
    el("statUnknown").textContent = unknown;

    const nextBtn = el("nextBlockBtn");
    if (state.block + 1 < BLOCK_COUNT) {
      nextBtn.hidden = false;
      nextBtn.disabled = false;
      nextBtn.textContent = "进入下一组（" + rangeText(state.block + 1) + "）";
    } else {
      nextBtn.hidden = true;
    }

    const retryBtn = el("retryBtn");
    if (unknown === 0) {
      retryBtn.disabled = true;
      retryBtn.textContent = "没有需要重练的词";
      el("endTitle").textContent = allDone ? "550 词全部完成" : "本组全部记住";
      el("endSub").textContent = allDone
        ? "五十词一组过完了。考前用「分组」和「词表」扫一遍，保持眼熟。"
        : "这一组没有生词了。可以进入下一组，或者回到「分组」挑选。";
    } else {
      retryBtn.disabled = false;
      retryBtn.textContent = "重练不熟的词（" + unknown + "）";
      el("endTitle").textContent = "本组完成";
      el("endSub").textContent = "不熟的词单独再过一遍，比整套重刷更有效。";
    }
  }

  /* ---------- actions ---------- */
  function flip() {
    const bs = state.blocks[state.block];
    if (bs.finished) return;
    el("flip").classList.toggle("flipped");
  }

  function mark(type) {
    const bs = state.blocks[state.block];
    if (bs.finished) return;
    const n = bs.queue[bs.idx];
    if (!n) return;
    bs.status[n] = type;
    if (bs.idx < bs.queue.length - 1) {
      bs.idx += 1;
    } else {
      bs.finished = true;
      bs.idx = bs.queue.length;
      cancelSpeech();
    }
    saveState();
    render();
  }

  function goPrev() {
    const bs = state.blocks[state.block];
    if (bs.finished || bs.idx === 0) return;
    bs.idx -= 1;
    saveState();
    render();
  }

  function goNext() {
    const bs = state.blocks[state.block];
    if (bs.finished || bs.idx >= bs.queue.length - 1) return;
    bs.idx += 1;
    saveState();
    render();
  }

  function switchBlock(b) {
    if (b < 0 || b >= BLOCK_COUNT) return;
    state.block = b;
    lastSpokenN = null;
    saveState();
    render();
    window.scrollTo(0, 0);
  }

  function goNextBlock() {
    switchBlock(state.block + 1);
  }

  function retryUnknown() {
    const bs = state.blocks[state.block];
    const ids = bs.queue.filter(n => bs.status[n] === "unfamiliar");
    if (!ids.length) return;
    state.blocks[state.block] = {
      queue: ids,
      idx: 0,
      status: {},
      finished: false,
      round: bs.round + 1
    };
    lastSpokenN = null;
    saveState();
    render();
    window.scrollTo(0, 0);
  }

  function restartBlock() {
    state.blocks[state.block] = freshBlock(state.block);
    lastSpokenN = null;
    saveState();
    render();
    window.scrollTo(0, 0);
  }

  /* ---------- sheets ---------- */
  function buildBlockList() {
    const box = el("blockList");
    box.innerHTML = "";
    const frag = document.createDocumentFragment();
    for (let b = 0; b < BLOCK_COUNT; b++) {
      const bs = state.blocks[b];
      const done = bs.queue.filter(n => bs.status[n]).length;
      const unknown = bs.queue.filter(n => bs.status[n] === "unfamiliar").length;

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "block-row" + (b === state.block ? " current" : "");

      const name = document.createElement("span");
      name.className = "block-name";
      name.textContent = "第 " + (b + 1) + " 组 ";
      const range = document.createElement("span");
      range.className = "block-range";
      range.textContent = rangeText(b);
      name.appendChild(range);

      const meta = document.createElement("span");
      meta.className = "block-meta";
      if (bs.finished) {
        meta.textContent = "已完成 · 不熟 " + unknown;
      } else if (done > 0) {
        meta.textContent = "已过 " + done + "/" + bs.queue.length + (bs.round > 1 ? " · 第" + bs.round + "轮" : "");
      } else {
        meta.textContent = "未开始";
      }

      const chev = document.createElement("span");
      chev.className = "chev";
      chev.textContent = "›";

      btn.append(name, meta, chev);
      btn.addEventListener("click", () => {
        switchBlock(b);
        el("blocksSheet").hidden = true;
      });
      frag.appendChild(btn);
    }
    box.appendChild(frag);
  }

  function buildWordList() {
    const bs = state.blocks[state.block];
    el("listTitle").textContent = blockLabel(state.block) + (bs.round > 1 ? " · 第 " + bs.round + " 轮" : "");
    const list = el("listItems");
    list.innerHTML = "";
    const frag = document.createDocumentFragment();
    bs.queue.forEach(n => {
      const w = byN.get(n);
      if (!w) return;
      const li = document.createElement("li");

      const word = document.createElement("span");
      word.className = "w";
      word.textContent = w.w;

      const ipa = document.createElement("span");
      ipa.className = "ipa";
      ipa.textContent = w.ipa;

      const meaning = document.createElement("span");
      meaning.className = "m";
      meaning.textContent = w.m;

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mini-speak";
      btn.setAttribute("aria-label", "朗读 " + w.w);
      btn.innerHTML = SPK;
      btn.addEventListener("click", e => {
        e.stopPropagation();
        speak(w.w, btn);
      });

      li.append(word, ipa, meaning, btn);
      frag.appendChild(li);
    });
    list.appendChild(frag);
  }

  /* ---------- events ---------- */
  el("flip").addEventListener("click", flip);
  el("flip").addEventListener("keydown", e => {
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      flip();
    }
  });

  el("speakFront").addEventListener("click", e => {
    e.stopPropagation();
    speakCurrent(e.currentTarget);
  });
  el("speakBack").addEventListener("click", e => {
    e.stopPropagation();
    speakCurrent(e.currentTarget);
  });

  el("knownBtn").addEventListener("click", () => mark("known"));
  el("unknownBtn").addEventListener("click", () => mark("unfamiliar"));
  el("prevBtn").addEventListener("click", goPrev);
  el("nextBtn").addEventListener("click", goNext);
  el("nextBlockBtn").addEventListener("click", goNextBlock);
  el("retryBtn").addEventListener("click", retryUnknown);
  el("againBtn").addEventListener("click", restartBlock);

  el("autoBtn").addEventListener("click", () => {
    state.autoSpeak = !state.autoSpeak;
    if (state.autoSpeak) {
      const w = currentWordObj();
      if (w) {
        lastSpokenN = w.n;
        speak(w.w);
      }
    } else {
      cancelSpeech();
      lastSpokenN = null;
    }
    el("autoBtn").classList.toggle("on", state.autoSpeak);
    el("autoBtn").setAttribute("aria-pressed", String(state.autoSpeak));
    saveState();
  });

  el("blocksBtn").addEventListener("click", () => {
    buildBlockList();
    el("blocksSheet").hidden = false;
  });
  el("closeBlocks").addEventListener("click", () => { el("blocksSheet").hidden = true; });
  el("blocksSheet").addEventListener("click", e => {
    if (e.target === el("blocksSheet")) el("blocksSheet").hidden = true;
  });

  el("listBtn").addEventListener("click", () => {
    buildWordList();
    el("listSheet").hidden = false;
  });
  el("closeList").addEventListener("click", () => { el("listSheet").hidden = true; });
  el("listSheet").addEventListener("click", e => {
    if (e.target === el("listSheet")) el("listSheet").hidden = true;
  });

  document.addEventListener("keydown", e => {
    const sheetsOpen = !el("blocksSheet").hidden || !el("listSheet").hidden;
    if (sheetsOpen) {
      if (e.key === "Escape") {
        el("blocksSheet").hidden = true;
        el("listSheet").hidden = true;
      }
      return;
    }
    const bs = state.blocks[state.block];
    if (bs.finished) return;
    if (e.key === " ") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); goNext(); }
    else if (e.key === "1") { mark("known"); }
    else if (e.key === "2") { mark("unfamiliar"); }
    else if (e.key === "p" || e.key === "P") { speakCurrent(null); }
  });

  function unlockAudio() {
    if (!hasTTS) return;
    if (!state.autoSpeak || didStart) return;
    const bs = state.blocks[state.block];
    if (bs.finished) return;
    const w = byN.get(bs.queue[bs.idx]);
    if (w) speak(w.w);
  }
  document.addEventListener("pointerdown", unlockAudio, { once: true });
  document.addEventListener("keydown", unlockAudio, { once: true });

  /* ---------- init ---------- */
  if (!hasTTS) document.body.classList.add("no-tts");
  if (hasTTS) {
    pickVoice();
    if (typeof window.speechSynthesis.addEventListener === "function") {
      window.speechSynthesis.addEventListener("voiceschanged", pickVoice);
    }
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  loadState();
  render();
</script>
</body>
</html>
