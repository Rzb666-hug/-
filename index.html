<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EDEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1716" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="救命50词">
<meta name="format-detection" content="telephone=no">
<title>四六级救命50词</title>
<style>
  /* palette: cool exam-paper neutrals, deep teal accent, amber for "不熟"
     type: serif headword / system sans for UI — no webfonts, so it works offline
     layout: one screen, no page scroll; card flexes, marks pinned to the bottom */
  :root {
    color-scheme: light;
    --bg: #E9EDEC;
    --surface: #FBFCFB;
    --ink: #15211F;
    --muted: #5C6B68;
    --line: #CBD5D2;
    --accent: #1D6B5F;
    --known-bg: #1D6B5F;
    --known-ink: #FFFFFF;
    --unknown-bg: #FAEEDA;
    --unknown-ink: #7E4F08;
    --unknown-line: #E2BE7E;
    --warn: #A8650A;
    --backdrop: rgba(10, 20, 18, 0.45);
    --shadow: 0 1px 2px rgba(15, 30, 28, 0.06), 0 14px 36px -18px rgba(15, 30, 28, 0.4);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0F1716;
      --surface: #17211F;
      --ink: #E7EFEC;
      --muted: #94A5A1;
      --line: #2A3734;
      --accent: #79C7B5;
      --known-bg: #79C7B5;
      --known-ink: #0A1513;
      --unknown-bg: #2A2216;
      --unknown-ink: #F0C37E;
      --unknown-line: #584529;
      --warn: #EBB264;
      --backdrop: rgba(0, 0, 0, 0.6);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 18px 40px -20px rgba(0, 0, 0, 0.8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F1716;
    --surface: #17211F;
    --ink: #E7EFEC;
    --muted: #94A5A1;
    --line: #2A3734;
    --accent: #79C7B5;
    --known-bg: #79C7B5;
    --known-ink: #0A1513;
    --unknown-bg: #2A2216;
    --unknown-ink: #F0C37E;
    --unknown-line: #584529;
    --warn: #EBB264;
    --backdrop: rgba(0, 0, 0, 0.6);
    --shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html {
    height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    margin: 0;
    height: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button { font-family: inherit; }

  .app {
    height: 100%;
    max-width: 560px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding:
      max(10px, env(safe-area-inset-top, 0px))
      max(16px, env(safe-area-inset-right, 0px))
      max(12px, env(safe-area-inset-bottom, 0px))
      max(16px, env(safe-area-inset-left, 0px));
    min-height: 0;
  }

  /* ---------- header ---------- */
  .bar { flex: 0 0 auto; display: flex; flex-direction: column; gap: 9px; }
  .bar-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .eyebrow {
    margin: 0 0 2px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: 0.01em; line-height: 1.15; }
  .ghost {
    min-height: 40px;
    padding: 0 15px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    flex: 0 0 auto;
    touch-action: manipulation;
  }
  .ghost:active { transform: scale(0.97); }
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  #countLabel {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--ink);
    font-size: 13px;
  }
  .dots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .dot {
    height: 6px;
    border-radius: 2px;
    background: var(--line);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .dot.done.known { background: var(--accent); }
  .dot.done.unfamiliar { background: var(--warn); }
  .dot.current { background: var(--ink); transform: scaleY(1.7); }

  /* ---------- card ---------- */
  .stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .flip {
    flex: 1 1 auto;
    min-height: 240px;
    perspective: 1600px;
    cursor: pointer;
    border-radius: 22px;
    touch-action: pan-y;
    will-change: transform;
    transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.25, 1);
  }
  .flip.dragging { transition: none; }
  .flip-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.25, 1);
  }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 54px 22px 46px;
    gap: 12px;
    text-align: center;
    overflow: hidden;
  }
  .face.back { transform: rotateY(180deg); }
  .freq {
    position: absolute;
    top: 16px;
    left: 20px;
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: 3px;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .freq b {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .word {
    margin: 0;
    font-family: ui-serif, Georgia, "Times New Roman", "Songti SC", "Noto Serif", serif;
    font-weight: 400;
    font-size: clamp(40px, 14vw, 74px);
    line-height: 1.04;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
    text-wrap: balance;
  }
  .back-word {
    position: absolute;
    top: 16px;
    left: 20px;
    margin: 0;
    font-family: ui-serif, Georgia, "Songti SC", serif;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .meaning {
    margin: 0;
    font-size: clamp(21px, 6.2vw, 29px);
    line-height: 1.55;
    font-weight: 500;
    max-width: 22ch;
    text-wrap: balance;
  }
  .hint {
    position: absolute;
    bottom: 14px;
    left: 0;
    right: 0;
    margin: 0;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  /* ---------- controls ---------- */
  .controls { flex: 0 0 auto; display: flex; flex-direction: column; gap: 9px; }
  .nav-row { display: flex; gap: 10px; }
  .mini {
    flex: 1;
    min-height: 42px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    font-size: 13.5px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .mini:active:not(:disabled) { background: rgba(0, 0, 0, 0.04); }
  .mini:disabled { opacity: 0.4; cursor: default; }
  .mark-row { display: flex; gap: 10px; }
  .mark {
    flex: 1;
    min-height: 56px;
    border-radius: 16px;
    border: 1px solid transparent;
    font-size: 16.5px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.08s ease;
  }
  .mark:active { transform: scale(0.97); }
  .mark.unknown {
    background: var(--unknown-bg);
    color: var(--unknown-ink);
    border-color: var(--unknown-line);
  }
  .mark.known { background: var(--known-bg); color: var(--known-ink); }
  .kbd-hint {
    margin: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  @media (hover: none), (pointer: coarse) { .kbd-hint { display: none; } }

  /* ---------- end screen ---------- */
  .end {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    padding: 8px 2px;
    text-align: center;
    overflow-y: auto;
  }
  .end h2 { margin: 0; font-size: 25px; font-weight: 600; line-height: 1.25; }
  .end .sub { margin: -4px 0 2px; font-size: 14px; line-height: 1.6; color: var(--muted); }
  .stats { display: flex; gap: 12px; }
  .stat {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--surface);
    padding: 15px 10px 13px;
  }
  .stat .n {
    display: block;
    font-size: 36px;
    font-weight: 600;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .stat .n.warn { color: var(--warn); }
  .stat .l { display: block; margin-top: 4px; font-size: 11.5px; letter-spacing: 0.1em; color: var(--muted); }
  .end-actions { display: flex; flex-direction: column; gap: 10px; }
  .cta {
    min-height: 54px;
    border: none;
    border-radius: 16px;
    background: var(--known-bg);
    color: var(--known-ink);
    font-size: 16.5px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }
  .cta:disabled { opacity: 0.45; cursor: default; }
  .cta:active:not(:disabled) { transform: scale(0.99); }

  /* ---------- word list sheet ---------- */
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--backdrop);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet-panel {
    width: 100%;
    max-width: 560px;
    max-height: 84%;
    max-height: 84dvh;
    background: var(--surface);
    color: var(--ink);
    border-radius: 20px 20px 0 0;
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    animation: rise 0.22s ease-out;
  }
  @keyframes rise { from { transform: translateY(18px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  .sheet-head {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .sheet-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  #sheetList {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  #sheetList li {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1px 12px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--line);
  }
  #sheetList li:last-child { border-bottom: none; }
  #sheetList li .w { font-family: ui-serif, Georgia, "Songti SC", serif; font-size: 19px; line-height: 1.25; }
  #sheetList li .f { font-size: 11px; color: var(--muted); align-self: center; font-variant-numeric: tabular-nums; }
  #sheetList li .m { grid-column: 1 / -1; font-size: 13px; line-height: 1.5; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .flip, .flip-inner, .dot, .mark { transition: none; }
    .mark:active { transform: none; }
    .sheet-panel { animation: none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="bar-row">
      <div>
        <p class="eyebrow">CET 4/6 高频词</p>
        <h1>四六级救命50词</h1>
      </div>
      <button class="ghost" id="listBtn" type="button">词表</button>
    </div>
    <div class="progress-row">
      <span id="roundLabel">第 1 轮 · 全部 50 词</span>
      <span id="countLabel">1 / 50</span>
    </div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </header>

  <main class="stage">
    <div class="flip" id="flip" role="button" tabindex="0" aria-label="单词卡片，点击翻面看释义">
      <div class="flip-inner">
        <section class="face front">
          <p class="freq"><b id="freqNum">414</b>次</p>
          <p class="word" id="word">available</p>
          <p class="hint">轻点翻面 · 左右滑切换</p>
        </section>
        <section class="face back">
          <p class="back-word" id="backWord">available</p>
          <p class="meaning" id="meaning">adj. 可利用的，可得到的</p>
          <p class="hint">轻点返回</p>
        </section>
      </div>
    </div>

    <section class="end" id="end" hidden>
      <div>
        <p class="eyebrow" id="endRound">第 1 轮</p>
        <h2 id="endTitle">本轮完成</h2>
      </div>
      <p class="sub" id="endSub"></p>
      <div class="stats">
        <div class="stat"><span class="n" id="statKnown">0</span><span class="l">认 识</span></div>
        <div class="stat"><span class="n warn" id="statUnknown">0</span><span class="l">不 熟</span></div>
      </div>
      <div class="end-actions">
        <button class="cta" id="retryBtn" type="button">重练不熟的词</button>
        <button class="ghost" id="againBtn" type="button">重新过全部 50 词</button>
      </div>
    </section>
  </main>

  <footer class="controls" id="controls">
    <div class="nav-row">
      <button class="mini" id="prevBtn" type="button">← 上一词</button>
      <button class="mini" id="nextBtn" type="button">下一词 →</button>
    </div>
    <div class="mark-row">
      <button class="mark unknown" id="unknownBtn" type="button">✗ 不熟</button>
      <button class="mark known" id="knownBtn" type="button">✓ 认识</button>
    </div>
    <p class="kbd-hint">空格翻面 · ← → 切换 · 1 认识 · 2 不熟</p>
  </footer>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="全部词表">
    <div class="sheet-head">
      <h2>全部 50 词</h2>
      <button class="ghost" id="closeSheet" type="button">关闭</button>
    </div>
    <ol id="sheetList"></ol>
  </div>
</div>

<script>
  const WORDS = [
    { id: 1,  word: "available",    freq: 414, meaning: "adj. 可利用的，可得到的" },
    { id: 2,  word: "resident",     freq: 395, meaning: "adj. 定居的；n. 居民" },
    { id: 3,  word: "conversation", freq: 392, meaning: "n. 交谈，谈话" },
    { id: 4,  word: "direction",    freq: 386, meaning: "n. 方向，指导" },
    { id: 5,  word: "sheet",        freq: 312, meaning: "n. 床单，一张(纸)，薄片" },
    { id: 6,  word: "correspond",   freq: 251, meaning: "v. 符合，联系" },
    { id: 7,  word: "advance",      freq: 247, meaning: "v. 促进，提前；n. 进步" },
    { id: 8,  word: "total",        freq: 219, meaning: "adj. 全部的；vt. 共计；n. 总数" },
    { id: 9,  word: "contribute",   freq: 212, meaning: "v. 贡献出；促进" },
    { id: 10, word: "single",       freq: 201, meaning: "adj. 一个的，单身的" },
    { id: 11, word: "information",  freq: 189, meaning: "n. 消息，资料" },
    { id: 12, word: "research",     freq: 175, meaning: "v. 研究，调查" },
    { id: 13, word: "experience",   freq: 171, meaning: "v./n. 经验，经历" },
    { id: 14, word: "program",      freq: 162, meaning: "n. 程序，节目；v. 编程" },
    { id: 15, word: "identify",     freq: 154, meaning: "v. 鉴定，认出，发现" },
    { id: 16, word: "digital",      freq: 146, meaning: "adj. 数码的，数字的" },
    { id: 17, word: "average",      freq: 135, meaning: "adj. 平均的，普通的" },
    { id: 18, word: "rate",         freq: 128, meaning: "n. 速度，价格；v. 评价，评估" },
    { id: 19, word: "position",     freq: 125, meaning: "n. 职位，处境，位置" },
    { id: 20, word: "appeal",       freq: 121, meaning: "n. 呼吁，恳求；申诉" },
    { id: 21, word: "feature",      freq: 118, meaning: "n. 面貌特征，特点" },
    { id: 22, word: "individual",   freq: 108, meaning: "adj. 个人的；n. 个人" },
    { id: 23, word: "academic",     freq: 99,  meaning: "adj. 学院的；n. 大学教师" },
    { id: 24, word: "access",       freq: 93,  meaning: "n. 入口；接近…的方法" },
    { id: 25, word: "obesity",      freq: 91,  meaning: "n. 肥大，肥胖" },
    { id: 26, word: "item",         freq: 86,  meaning: "n. 物品，条款，项目" },
    { id: 27, word: "recession",    freq: 85,  meaning: "n. 经济衰退" },
    { id: 28, word: "process",      freq: 79,  meaning: "v. 处理；n. 过程；步骤" },
    { id: 29, word: "regulation",   freq: 78,  meaning: "n. 规章" },
    { id: 30, word: "release",      freq: 75,  meaning: "v. 释放，发布；放开" },
    { id: 31, word: "tend",         freq: 72,  meaning: "v. 趋向" },
    { id: 32, word: "promote",      freq: 70,  meaning: "v. 促进，提升，推销" },
    { id: 33, word: "affect",       freq: 65,  meaning: "v. 影响，感动，假装" },
    { id: 34, word: "involve",      freq: 65,  meaning: "v. 包含；参与" },
    { id: 35, word: "communicate",  freq: 64,  meaning: "v. 交流；传播" },
    { id: 36, word: "condition",    freq: 61,  meaning: "n. 条件，状态" },
    { id: 37, word: "professional", freq: 59,  meaning: "adj. 专业的" },
    { id: 38, word: "pose",         freq: 59,  meaning: "v. 引起(困难等)；提出" },
    { id: 39, word: "concern",      freq: 59,  meaning: "v. 涉及；n. 担心" },
    { id: 40, word: "compound",     freq: 58,  meaning: "n. 化合物；v. 合成" },
    { id: 41, word: "approach",     freq: 57,  meaning: "v. 接近；n. 接近；方法" },
    { id: 42, word: "nature",       freq: 52,  meaning: "n. 大自然，天性" },
    { id: 43, word: "occasion",     freq: 52,  meaning: "n. 场合，时机" },
    { id: 44, word: "major",        freq: 52,  meaning: "adj. 主要的；v. 主修" },
    { id: 45, word: "impact",       freq: 51,  meaning: "n.&v. 影响" },
    { id: 46, word: "financial",    freq: 50,  meaning: "adj. 财政的，金融的" },
    { id: 47, word: "derive",       freq: 50,  meaning: "v. 起源，来自" },
    { id: 48, word: "potential",    freq: 50,  meaning: "n. 潜力；adj. 潜在的" },
    { id: 49, word: "university",   freq: 49,  meaning: "n. 大学" },
    { id: 50, word: "function",     freq: 49,  meaning: "n. 功能；v. 起作用" }
  ];

  const byId = new Map(WORDS.map(w => [w.id, w]));
  const ALL_IDS = WORDS.map(w => w.id);
  const KEY = "cet50.v1";

  const state = { round: 1, queue: ALL_IDS.slice(), idx: 0, status: {}, finished: false };

  const el = id => document.getElementById(id);
  const flipEl = el("flip");
  const sheetEl = el("sheet");

  function loadState() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (!saved || !Array.isArray(saved.queue) || !saved.queue.length) return;
      const queue = saved.queue.filter(id => byId.has(id));
      if (!queue.length) return;
      state.queue = queue;
      state.round = Number.isInteger(saved.round) && saved.round > 0 ? saved.round : 1;
      state.idx = Math.min(Math.max(0, Number(saved.idx) || 0), queue.length);
      state.status = saved.status && typeof saved.status === "object" ? saved.status : {};
      state.finished = !!saved.finished;
      if (state.finished) state.idx = queue.length;
    } catch (e) { /* storage unavailable — run in memory */ }
  }

  function saveState() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  function currentWord() { return byId.get(state.queue[state.idx]); }

  function buzz(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  function flip() {
    if (state.finished) return;
    flipEl.classList.toggle("flipped");
  }

  function render() {
    el("roundLabel").textContent = state.round === 1
      ? `第 1 轮 · 全部 ${state.queue.length} 词`
      : `第 ${state.round} 轮 · 不熟重练 ${state.queue.length} 词`;

    const dots = el("dots");
    dots.innerHTML = "";
    const frag = document.createDocumentFragment();
    state.queue.forEach((id, i) => {
      const dot = document.createElement("span");
      dot.className = "dot";
      const st = state.status[id];
      if (st) dot.classList.add("done", st);
      if (i === state.idx && !state.finished) dot.classList.add("current");
      frag.appendChild(dot);
    });
    dots.appendChild(frag);

    const shown = state.finished ? state.queue.length : Math.min(state.idx + 1, state.queue.length);
    el("countLabel").textContent = `${shown} / ${state.queue.length}`;

    if (state.finished) { renderEnd(); return; }

    flipEl.hidden = false;
    el("end").hidden = true;
    el("controls").hidden = false;

    const w = currentWord();
    if (!w) return;
    el("word").textContent = w.word;
    el("meaning").textContent = w.meaning;
    el("freqNum").textContent = w.freq;
    el("backWord").textContent = w.word;
    flipEl.classList.remove("flipped");
    flipEl.style.transform = "";
    flipEl.setAttribute("aria-label", `${w.word}，点击翻面看释义`);
    el("prevBtn").disabled = state.idx === 0;
    el("nextBtn").disabled = state.idx >= state.queue.length - 1;
  }

  function renderEnd() {
    flipEl.hidden = true;
    el("controls").hidden = true;
    const end = el("end");
    end.hidden = false;

    const known = state.queue.filter(id => state.status[id] === "known").length;
    const unknownIds = state.queue.filter(id => state.status[id] === "unfamiliar");
    const unknown = unknownIds.length;

    el("endRound").textContent = state.round === 1 ? "第 1 轮" : `第 ${state.round} 轮`;
    el("statKnown").textContent = known;
    el("statUnknown").textContent = unknown;

    if (unknown === 0) {
      el("endTitle").textContent = "全部记住了";
      el("endSub").textContent = "这批词都过了。考前再用「词表」扫一遍，保持眼熟。";
      el("retryBtn").disabled = true;
      el("retryBtn").textContent = "没有需要重练的词";
    } else {
      el("endTitle").textContent = "本轮完成";
      el("endSub").textContent = "不熟的词单独再过一遍，比整套重刷更有效。";
      el("retryBtn").disabled = false;
      el("retryBtn").textContent = `重练不熟的词（${unknown}）`;
    }
  }

  function mark(type) {
    if (state.finished) return;
    const w = currentWord();
    if (!w) return;
    state.status[w.id] = type;
    buzz(12);
    if (state.idx < state.queue.length - 1) {
      state.idx += 1;
    } else {
      state.finished = true;
      state.idx = state.queue.length;
    }
    saveState();
    render();
  }

  function goPrev() {
    if (state.finished || state.idx === 0) return;
    state.idx -= 1;
    saveState();
    render();
  }

  function goNext() {
    if (state.finished || state.idx >= state.queue.length - 1) return;
    state.idx += 1;
    saveState();
    render();
  }

  function startRound(queue, round) {
    state.queue = queue;
    state.round = round;
    state.idx = 0;
    state.status = {};
    state.finished = false;
    saveState();
    render();
    window.scrollTo(0, 0);
  }

  function retryUnknown() {
    const unknownIds = state.queue.filter(id => state.status[id] === "unfamiliar");
    if (!unknownIds.length) return;
    startRound(unknownIds, state.round + 1);
  }

  function restartAll() { startRound(ALL_IDS.slice(), 1); }

  function buildSheet() {
    const list = el("sheetList");
    const frag = document.createDocumentFragment();
    WORDS.forEach(w => {
      const li = document.createElement("li");
      const word = document.createElement("span");
      word.className = "w";
      word.textContent = w.word;
      const freq = document.createElement("span");
      freq.className = "f";
      freq.textContent = `${w.freq}次`;
      const meaning = document.createElement("span");
      meaning.className = "m";
      meaning.textContent = w.meaning;
      li.append(word, freq, meaning);
      frag.appendChild(li);
    });
    list.appendChild(frag);
  }

  /* ---- tap to flip, horizontal swipe to move ---- */
  let downX = 0, downY = 0, deltaX = 0, tracking = false, swiped = false;

  flipEl.addEventListener("pointerdown", e => {
    if (state.finished || e.pointerType === "mouse" && e.button !== 0) return;
    tracking = true; swiped = false;
    downX = e.clientX; downY = e.clientY; deltaX = 0;
    flipEl.classList.add("dragging");
    try { flipEl.setPointerCapture(e.pointerId); } catch (err) {}
  });

  flipEl.addEventListener("pointermove", e => {
    if (!tracking) return;
    const dx = e.clientX - downX;
    const dy = e.clientY - downY;
    if (Math.abs(dy) > Math.abs(dx) + 8) { deltaX = 0; return; }
    deltaX = dx;
    if (Math.abs(dx) > 8) swiped = true;
    flipEl.style.transform = `translateX(${Math.max(-110, Math.min(110, dx * 0.45))}px)`;
  });

  function endDrag() {
    if (!tracking) return;
    tracking = false;
    flipEl.classList.remove("dragging");
    const threshold = 52;
    if (Math.abs(deltaX) > threshold) {
      const dir = deltaX < 0 ? 1 : -1; // swipe left -> next
      flipEl.style.transform = "";
      if (dir === 1) goNext(); else goPrev();
      buzz(8);
    } else {
      flipEl.style.transform = "";
      if (!swiped) flip();
    }
    deltaX = 0;
  }

  flipEl.addEventListener("pointerup", endDrag);
  flipEl.addEventListener("pointercancel", () => {
    tracking = false; swiped = false; deltaX = 0;
    flipEl.classList.remove("dragging");
    flipEl.style.transform = "";
  });
  flipEl.addEventListener("keydown", e => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  });

  el("knownBtn").addEventListener("click", () => mark("known"));
  el("unknownBtn").addEventListener("click", () => mark("unfamiliar"));
  el("prevBtn").addEventListener("click", goPrev);
  el("nextBtn").addEventListener("click", goNext);
  el("retryBtn").addEventListener("click", retryUnknown);
  el("againBtn").addEventListener("click", restartAll);

  el("listBtn").addEventListener("click", () => { sheetEl.hidden = false; });
  el("closeSheet").addEventListener("click", () => { sheetEl.hidden = true; });
  sheetEl.addEventListener("click", e => { if (e.target === sheetEl) sheetEl.hidden = true; });

  document.addEventListener("keydown", e => {
    if (!sheetEl.hidden) {
      if (e.key === "Escape") sheetEl.hidden = true;
      return;
    }
    if (state.finished) return;
    if (e.key === " ") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); goNext(); }
    else if (e.key === "1") { mark("known"); }
    else if (e.key === "2") { mark("unfamiliar"); }
  });

  loadState();
  buildSheet();
  render();
</script>
</body>
</html>
